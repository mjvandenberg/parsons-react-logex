server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Web Component as an ES module that other sites can import.
    location /lib/ {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }
}
